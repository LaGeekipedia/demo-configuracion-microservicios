spring.application.name=microservice-demo
server.port=5050

mensaje.bienvenida=Hola desde el Microservicio Demo - Actualización en tiempo real. desde DEV
mensaje=${mensaje.bienvenida}

app.rest.connectTimeout=1s
app.rest.readTimeout=1s

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

resilience4j.circuitbreaker.instances.pagosCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.pagosCB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.pagosCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.pagosCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.pagosCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.pagosCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.pagosCB.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.pagosCB.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.retry.instances.pagosRetry.maxAttempts=3
resilience4j.retry.instances.pagosRetry.waitDuration=500ms
resilience4j.retry.instances.pagosRetry.retryExceptions=org.springframework.web.client.ResourceAccessException,java.net.SocketTimeoutException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.pagosRetry.ignoreExceptions=org.springframework.web.client.HttpClientErrorException

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=pagos.exchange
app.rabbitmq.queue=pagos.nuevos.q
app.rabbitmq.routingKey=pagos.creado

spring.rabbitmq.template.mandatory=true