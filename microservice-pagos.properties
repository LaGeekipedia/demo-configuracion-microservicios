spring.application.name=microservice-pagos
server.port=8082
mensaje.bienvenida=Hola desde el Microservicio Pagos - Actualización en tiempo real.
management.endpoints.web.exposure.include=refresh,health,info

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=pagos.exchange
app.rabbitmq.queue=pagos.nuevos.q
app.rabbitmq.routingKey=pagos.creado

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pagos_db
spring.datasource.username=pagos_user
spring.datasource.password=${PAGOS_DB_PASSWORD}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true